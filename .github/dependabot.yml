version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      analyzers:
        patterns: ["StyleCop.*", "SonarAnalyzer.*"]
      tests:
        patterns: ["xunit*", "Microsoft.Testing.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
